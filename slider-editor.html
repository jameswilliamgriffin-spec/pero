<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider Editor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 30px 140px;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #999; font-size: 13px; margin: 0 0 30px; max-width: 70ch; }
  section { margin-bottom: 60px; }
  section h2 {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 2px solid #444;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  section h2 span { color: #888; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
  }
  figure {
    margin: 0;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    cursor: grab;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  figure.dragging { opacity: 0.35; }
  figure.drag-over { transform: scale(0.97); border-color: #ffd400; }
  .thumb {
    width: 100%;
    height: 220px;
    background:
      linear-gradient(45deg, #262626 25%, transparent 25%),
      linear-gradient(-45deg, #262626 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #262626 75%),
      linear-gradient(-45deg, transparent 75%, #262626 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .thumb img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }
  .num {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #ffd400;
    color: #111;
    font-weight: 800;
    font-size: 15px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 4px;
  }
  .del {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(20,20,20,0.85);
    color: #fff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .del:hover { background: #e04b3f; }
  figcaption {
    padding: 8px 10px 10px;
    font-size: 11px;
    color: #999;
    word-break: break-all;
    pointer-events: none;
  }
  .empty {
    color: #666;
    font-size: 13px;
    padding: 20px 0;
  }

  .bar {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: #1a1a1a;
    border-top: 1px solid #333;
    padding: 16px 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }
  .bar input[type="password"] {
    background: #111;
    border: 1px solid #444;
    color: #eee;
    padding: 9px 12px;
    border-radius: 5px;
    font-size: 13px;
    width: 200px;
  }
  .bar button {
    background: #ffd400;
    color: #111;
    border: none;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
  }
  .bar button:hover { background: #ffe14d; }
  .bar button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .status { font-size: 13px; }
  .status.ok { color: #7ee787; }
  .status.err { color: #ff8a65; }
</style>
</head>
<body>

<h1>Slider Editor</h1>
<p class="sub">Drag thumbnails to reorder within a section (order only matters within its own slider). Click the ✕ to remove one entirely from the site. Nothing is saved until you click "Save to manifest".</p>

<section>
  <h2>Slider 1 — Portrait <span id="count-1"></span></h2>
  <div class="grid" id="grid-portrait"></div>
</section>

<section>
  <h2>Slider 2 — Landscape <span id="count-2"></span></h2>
  <div class="grid" id="grid-landscape"></div>
</section>

<div class="bar">
  <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password">
  <button id="saveBtn">Save to manifest</button>
  <span class="status" id="status"></span>
</div>

<script>
  var portrait = [];
  var landscape = [];

  fetch('assets/images/rotation/manifest.json', { cache: 'no-cache' })
    .then(function (res) { return res.json(); })
    .then(function (manifest) {
      portrait = manifest.filter(function (e) { return e.orientation === 'portrait'; });
      landscape = manifest.filter(function (e) { return e.orientation === 'landscape'; });
      renderAll();
    })
    .catch(function (err) {
      document.getElementById('status').textContent = 'Failed to load manifest: ' + err;
      document.getElementById('status').className = 'status err';
    });

  function renderAll() {
    render(portrait, 'grid-portrait', 'count-1');
    render(landscape, 'grid-landscape', 'count-2');
  }

  var dragList = null;
  var dragFromIndex = null;

  function render(list, gridId, countId) {
    var grid = document.getElementById(gridId);
    document.getElementById(countId).textContent = '(' + list.length + ' images)';
    grid.innerHTML = '';

    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No images left in this slider.';
      grid.appendChild(empty);
      return;
    }

    list.forEach(function (item, i) {
      var fig = document.createElement('figure');
      fig.draggable = true;
      fig.dataset.index = i;

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      var img = document.createElement('img');
      img.src = item.path;
      img.alt = item.file;
      thumb.appendChild(img);

      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = i + 1;

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '✕';
      del.title = 'Remove from this slider';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        list.splice(i, 1);
        renderAll();
      });

      var cap = document.createElement('figcaption');
      cap.textContent = item.file;

      fig.appendChild(thumb);
      fig.appendChild(num);
      fig.appendChild(del);
      fig.appendChild(cap);

      fig.addEventListener('dragstart', function () {
        dragList = list;
        dragFromIndex = i;
        fig.classList.add('dragging');
      });
      fig.addEventListener('dragend', function () {
        fig.classList.remove('dragging');
      });
      fig.addEventListener('dragover', function (e) {
        if (dragList !== list) return;
        e.preventDefault();
        fig.classList.add('drag-over');
      });
      fig.addEventListener('dragleave', function () {
        fig.classList.remove('drag-over');
      });
      fig.addEventListener('drop', function (e) {
        e.preventDefault();
        fig.classList.remove('drag-over');
        if (dragList !== list || dragFromIndex === null) return;
        var moved = list.splice(dragFromIndex, 1)[0];
        list.splice(i, 0, moved);
        dragList = null;
        dragFromIndex = null;
        renderAll();
      });

      grid.appendChild(fig);
    });
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    var statusEl = document.getElementById('status');
    var pw = document.getElementById('pw').value;
    var btn = this;
    btn.disabled = true;
    statusEl.textContent = 'Saving…';
    statusEl.className = 'status';

    fetch('/api/update-manifest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
      body: JSON.stringify({
        portrait: portrait.map(function (e) { return e.file; }),
        landscape: landscape.map(function (e) { return e.file; })
      })
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        btn.disabled = false;
        if (result.ok) {
          statusEl.textContent = 'Saved — ' + result.body.portraitCount + ' portrait, ' + result.body.landscapeCount + ' landscape.';
          statusEl.className = 'status ok';
        } else {
          statusEl.textContent = 'Error: ' + (result.body.error || 'unknown');
          statusEl.className = 'status err';
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        statusEl.textContent = 'Request failed: ' + err;
        statusEl.className = 'status err';
      });
  });
</script>

</body>
</html>
